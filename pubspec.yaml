name: luna
description: Wearable Menstrual Wellness Monitoring Dashboard — IT4031 SLIIT
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # HTTP & State
  http: ^1.2.1
  provider: ^6.1.2

  # UI
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2

  # Utilities
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
